[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrestyler"
version = "0.1.0"   # equal to mdrestyler.__version__; tests/test_core.py checks it
description = "Measure prose against an author voice profile, guard against copying, and restyle a Markdown book toward it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Taras Baranyuk" }]
keywords = ["stylometry", "voice", "style", "markdown", "epub", "fiction", "writing", "copy guard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
mdrestyler = "mdrestyler.cli:main_exit"

[project.urls]
Homepage = "https://github.com/sagol/mdrestyler"

[tool.setuptools]
package-dir = { "" = "skills/mdrestyler/scripts" }
packages = ["mdrestyler"]

[tool.setuptools.package-data]
mdrestyler = ["defaults/*", "_build.json", "MANIFEST.json"]   # MANIFEST.json: the skill's, staged in by tools/build_wheel.py
