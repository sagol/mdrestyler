name: mdrestyler
description: Measure Markdown prose against an author voice profile, guard against copying, and table a book's voice drift.
author: Taras Baranyuk
branding:
  icon: feather
  color: purple

inputs:
  command:
    description: The mdrestyler command to run, such as check, rank, book, verify or profile.
    required: false
    default: check
  args:
    description: The command's arguments as one string, split like a shell would, such as "--profile voice chapters/01.md --strict".
    required: false
    default: ''
  working-directory:
    description: The folder to run in; paths in args are relative to it.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Run mdrestyler
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MDRESTYLER_TOOL: ${{ github.action_path }}/skills/mdrestyler/scripts/mdrestyler.py
        MDRESTYLER_COMMAND: ${{ inputs.command }}
        MDRESTYLER_ARGS: ${{ inputs.args }}
      run: |
        python=python3
        command -v python3 >/dev/null 2>&1 || python=python
        "$python" -c 'import os, shlex, subprocess, sys
        sys.exit(subprocess.call([sys.executable, os.environ["MDRESTYLER_TOOL"], os.environ["MDRESTYLER_COMMAND"],
                                  *shlex.split(os.environ["MDRESTYLER_ARGS"])]))'
