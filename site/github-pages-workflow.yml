# Template for a GitHub Actions workflow that validates site/ and deploys it to GitHub Pages.
# It is not installed. To use it:
#   1. Copy this file to .github/workflows/pages.yml
#   2. In the repository's Settings -> Pages -> Build and deployment, set Source to "GitHub Actions".

name: pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "skills/mdrestyler/**"
      - "action.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "skills/mdrestyler/**"
      - "action.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # mdrestyler and the validator use the standard library only: nothing to install.
      - name: Validate the site against the code
        run: |
          node --check site/app.js
          bash -n site/deploy-gh-pages.sh
          python3 site/validate.py
          python3 -m unittest tests.test_skill

      - name: Stage the public files
        run: python3 site/stage.py _site

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: "./_site"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
